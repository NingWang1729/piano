# pyproject.toml alone configures the build (there is no setup.py); setuptools 77 reads the SPDX license string below
[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "piano-integration"
version = "0.2.0"
description = "PIANO: Probabilistic Inference Autoencoder Networks for multi-Omics"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fast-array-utils",
    "matplotlib",
    "numpy>=2",
    "pandas<3",  # pandas 3 is not supported yet (SCRUM-194: .h5ad writes of its string arrays, Composer.load)
    "scipy",
    "scikit-misc",
    "anndata",
    "scanpy",
    "torch>=2.2,<2.8",
    # Imported by piano itself, so declared even though anndata and scanpy also install them
    "h5py",
    "numba",
    "statsmodels",
    "tqdm",
    "umap-learn",  # piano.utils.umap, which plot_umaps and the command line use
]
authors = [
    {name = "Ning Wang", email = "nw8333@princeton.edu"}
]
license = "GPL-3.0-or-later"
license-files = ["LICEN[CS]E*"]
classifiers = [
  "Programming Language :: Python",
  "Operating System :: OS Independent"
]
[project.optional-dependencies]
rapids = [
    "torch>=2.2,<2.8",
    "rapids-singlecell[rapids12]==0.13.1"
]
scvi-tools = [
    "torch>=2.2,<2.8",
    "jax[cuda12]",
    "scvi-tools",
    "chex<=0.1.91",  # Pin to avoid scIB giving false positives for JAX type check errors
    "scib-metrics==0.5.3"
]
torch = [
    "torch>=2.2,<2.8",
    "torchvision",
    "torchaudio",
]
misc = [
    "cirrocumulus",
    "faiss-cpu",
    "igraph",
    "joblib",
    "jupyterlab",
    "leidenalg",
    "memory_profiler",
    "pot",
    "pyro-ppl",  # The tests' reference for the ZINB likelihood (piano itself no longer uses pyro)
    "pytest",
    "seaborn",
    "torch>=2.2,<2.8",
    "umap-learn",
]
loom = [
    "loompy",  # Reads .loom files (piano.utils.io.read_loom)
]
all = ["piano-integration[rapids,scvi-tools,torch,misc,loom]"]

# The wheel holds the piano package and its subpackages only
[tool.setuptools.packages.find]
include = ["piano*"]

[tool.pytest.ini_options]
# large_gpu tests need about 5 GiB of free GPU memory and are left out of default runs; run them in their own MIG job
# with `pytest -m large_gpu` (the last -m given wins) when piano/utils/triton_sparse.py or the SparseGPU code changes
markers = ["large_gpu: needs about 5 GiB of free GPU memory; opt-in with -m large_gpu"]
addopts = "-m 'not large_gpu'"
